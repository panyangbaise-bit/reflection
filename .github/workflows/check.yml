name: Backend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked
      - run: docker compose up -d --wait
      - run: uv run alembic upgrade head
      - run: uv run alembic upgrade head
        env:
          PA_MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:local-owner-only@localhost:55432/portfolio_test
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run alembic check
      - run: uv run pytest --cov=portfolio_backend --cov-report=term-missing -q
      - run: uv run python scripts/export-openapi.py && git diff --exit-code -- docs/openapi.json
      - if: always()
        run: docker compose down
