name: reflection-simulator

x-env: &env
  PA_ENVIRONMENT: development
  PA_STORE_ENVIRONMENT: Sandbox
  PA_DATABASE_URL: postgresql+psycopg://pa_app:local-app-only@postgres:5432/portfolio
  PA_CONTROL_DATABASE_URL: postgresql+psycopg://pa_control:local-control-only@postgres:5432/portfolio
  PA_MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:local-owner-only@postgres:5432/portfolio
  PA_CACHE_URL: redis://cache:6379/0
  PA_BROKER_URL: redis://broker:6379/0
  PA_CATALOG_AUTO_DISCOVER: "false"
  PA_SIMULATOR_AI: "true"
  PA_AI_PROVIDER_ID: local-simulator
  PA_AI_DISCLOSURE_VERSION: "2"
  PA_AI_MARKET_DATA_PROVIDERS: '["local-fixture"]'
  PA_ADMIN_CREDENTIALS: '${PA_SIM_ADMIN_CREDENTIALS:-{}}'

x-app: &app
  image: reflection-simulator:local
  build: .
  environment: *env
  init: true
  depends_on:
    postgres: {condition: service_healthy}
    cache: {condition: service_started}
    broker: {condition: service_started}

services:
  postgres:
    image: postgres:17-alpine
    environment: {POSTGRES_DB: portfolio, POSTGRES_PASSWORD: local-owner-only}
    volumes:
      - simulator-postgres:/var/lib/postgresql/data
      - ./deploy/init-local.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d portfolio"]
      interval: 3s
      retries: 30
  cache:
    image: redis:7.4-alpine
  broker:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes: [simulator-broker:/data]
  migrate:
    <<: *app
    profiles: [tools]
    command: [alembic, upgrade, head]
  seed:
    <<: *app
    profiles: [tools]
    command: [python, scripts/seed-simulator.py]
  api:
    <<: *app
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 5s
      retries: 20
  worker:
    <<: *app
    command: [celery, -A, "portfolio_backend.worker:celery", worker, -Q, "interactive_ai,daily_reports,weekly_reports,privacy", --concurrency=1, --loglevel=WARNING, --without-gossip, --without-mingle]
  dispatcher:
    <<: *app
    command: [portfolio-dispatcher]
  scheduler:
    <<: *app
    command: [portfolio-scheduler]
volumes:
  simulator-postgres:
  simulator-broker:
